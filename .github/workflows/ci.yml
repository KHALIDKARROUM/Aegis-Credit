name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-only-secret-key-not-for-production-1234567890"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate dependencies
        run: python -m pip check

      - name: Compile Python
        run: python -m compileall -q app bankrisk_compass src

      - name: Run Django checks
        run: python manage.py check

      - name: Apply migrations and bootstrap roles
        run: |
          python manage.py migrate --no-input
          python manage.py bootstrap_roles

      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

      - name: Smoke-test monitoring tools
        run: |
          python -m src.monitor_model --data data/credit_risk.csv --output /tmp/drift.csv
          python -m src.validate_external --data data/credit_risk.csv --output /tmp/external.csv

      - name: Run deployment security checks
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-only-long-random-deployment-secret-key-1234567890-abcdef"
          ALLOWED_HOSTS: "example.test"
        run: python manage.py check --deploy
