name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "True"
      LOGIN_REQUIRED: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate ephemeral test secrets
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import base64
          import secrets
          print(f"SECRET_KEY={secrets.token_urlsafe(48)}")
          print(f"AUDIT_HMAC_KEY={secrets.token_urlsafe(48)}")
          print(f"FIELD_ENCRYPTION_KEY={base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()}")
          print(f"BACKUP_ENCRYPTION_KEY={base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()}")
          print(f"MODEL_SIGNING_PUBLIC_KEY={base64.b64encode(secrets.token_bytes(32)).decode()}")
          PY

      - name: Validate dependencies
        run: python -m pip check

      - name: Compile Python
        run: python -m compileall -q app bankrisk_compass src

      - name: Run Django checks
        run: python manage.py check

      - name: Apply migrations and bootstrap roles
        run: |
          python manage.py migrate --no-input
          python manage.py bootstrap_roles

      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

      - name: Smoke-test monitoring tools
        run: |
          python -m src.monitor_model --data data/credit_risk.csv --output /tmp/drift.csv
          python -m src.validate_external --data data/credit_risk.csv --output /tmp/external.csv

      - name: Run deployment security checks
        env:
          DEBUG: "False"
          LOGIN_REQUIRED: "True"
          ALLOWED_HOSTS: "example.test"
        run: python manage.py check --deploy
