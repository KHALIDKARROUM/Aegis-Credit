services:
  - type: web
    name: bankrisk-compass
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn bankrisk_compass.wsgi:application --workers 2 --threads 2 --timeout 120
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: SCORING_API_KEY
        generateValue: true
